services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tepuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepuy}
      POSTGRES_DB: ${POSTGRES_DB:-tepuy}
    ports:
      - "5432:5432"
    volumes:
      - tepuy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tepuy} -d ${POSTGRES_DB:-tepuy}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tepuy}:${POSTGRES_PASSWORD:-tepuy}@db:5432/${POSTGRES_DB:-tepuy}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data_pipeline:/data_pipeline
    command: >
      sh -c "alembic upgrade head &&
             python -m data_pipeline.sources.manual_seed.load &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  tepuy_db:
